[project]
name = "faculty-feud"
version = "2.0.0"
description = "A Family-Feud-style game show board for SCS Day."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "PySide6-Addons>=6.6"]

[project.scripts]
faculty-feud = "faculty_feud.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
